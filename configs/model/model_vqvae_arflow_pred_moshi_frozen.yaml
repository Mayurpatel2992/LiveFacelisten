# Experiment 1 -- liveface_moshi_frozen
# Mimi RVQ codes -> sum(Moshi emb[:8]) -> 4096-D audio conditioning
# (replaces the baseline HuBERT-xlarge frame-paired 2560-D feature).
# Mimi frozen (codes precomputed). Moshi emb[:8] FROZEN. Stage-1 frozen.
# Everything else is inherited verbatim from model_vqvae_arflow_pred.yaml so the
# ONLY independent variable vs the HuBERT baseline is the audio representation.
defaults:
  - model_vqvae_arflow_pred
  - _self_

arflow:
  audio_conditioning: moshi            # hubert | moshi | hubert_moshi
  moshi_embedding_trainable: false
  moshi_emb_path: ${path.datasets}/moshi_audio_emb.pt
  moshi_num_codebooks: 8
  moshi_feature_norm: layernorm        # non-affine LN on the summed emb (~0.02 std -> ~unit); 'none' to ablate
  moshi_align_train: interp            # offline 12.5->25 Hz resample: 'interp' (smooth) | 'hold' (causal step)
