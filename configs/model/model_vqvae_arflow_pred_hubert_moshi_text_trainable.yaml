# Experiment 6 -- liveface_hubert_moshi_text_trainable
# HuBERT-xlarge 2560-D  ++  [ Mimi audio -> Moshi emb[:8] 4096-D  concat  Moshi
# Inner-Monologue text -> Moshi text_emb 4096-D ]  ->  audio_dim = 10752.
#
# Combines the strong continuous SSL features (HuBERT path UNCHANGED from the
# baseline) with the full MIBURI dual token conditioning. Both copied Moshi
# tables (emb[:8] AND text_emb) are TRAINABLE and adapt to MEAD facial motion,
# matching the released MIBURI behaviour (textaudio_emb_freeze=False) -- i.e. the
# HuBERT variant of Experiment 5 (moshi_text_trainable).
#
# Tests: does the transcript/text stream still add signal when the model already
# has HuBERT's continuous features? Mimi frozen (codes precomputed). Stage-1
# frozen. Everything else inherited from model_vqvae_arflow_pred.yaml.
#
# Needs data=mead_pred_moshi_text (raw waveform for HuBERT + precomputed
# mimi_codes + precomputed moshi_text_codes) and a working `transformers`
# (pip install "huggingface_hub==0.19.4").
defaults:
  - model_vqvae_arflow_pred
  - _self_

arflow:
  audio_conditioning: hubert_moshi     # HuBERT ++ (Moshi audio concat Moshi text)
  moshi_embedding_trainable: true
  moshi_emb_path: ${path.datasets}/moshi_audio_emb.pt
  moshi_num_codebooks: 8
  moshi_feature_norm: layernorm        # non-affine LN on the summed emb
  moshi_align_train: interp            # offline 12.5->25 Hz resample: 'interp' | 'hold'

  moshi_use_text: true
  moshi_text_emb_path: ${path.datasets}/moshi_text_emb.pt
  moshi_text_emb_trainable: true
  moshi_text_feature_norm: layernorm   # non-affine LN on the text emb (scale parity)
  moshi_text_fuse: concat             # 'concat' (4096+4096 -> 8192) | 'sum' (-> 4096)
