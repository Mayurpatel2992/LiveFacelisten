hydra:
  run:
    dir: .
  output_subdir: null

seed: 1234
logger_level: INFO

folder: ???                 # run folder, e.g. outputs/DualTalk/dualtalk_controlnet/<id>
ckpt: best                  # 'best' = tensorboard/*/checkpoints/best-epoch=*.ckpt, or a path
split: test                 # test | ood | val
number_of_samples: 1        # >1 also saves <key>_s<k>.npy for diversity
sampling_steps: null        # flow ODE steps (null = the model's)
gate: null                  # Option B only: pred | vad | ones (null = the model's gate_infer_source)
device: 0
max_tracks: null            # debug: stop after this many tracks
token_temperature: null     # AR code sampling temperature (null = the model's; 0 = argmax)
teacher_forced: false       # diagnostic: GT code history, no AR feedback (speaking model only)
tag: ""                     # suffix for the output folder, e.g. _ep99

defaults:
  - /path@path
  - override hydra/job_logging: rich
  - override hydra/hydra_logging: rich
  - _self_
